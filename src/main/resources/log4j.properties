# Root logger - write to both console and file
log4j.rootLogger=INFO,console,file

# HBase root logger
#hbase.root.logger=INFO,console,file

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{2}: %m%n

# Rolling file appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/cod-example-application.log
log4j.appender.file.MaxFileSize=50MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{2}: %m%n

# Application specific logging
log4j.logger.com.cloudera.cod.example=INFO
log4j.logger.org.apache.phoenix=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.hbase=WARN
